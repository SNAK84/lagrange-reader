name: Android RU Release

on:
  push:
    tags:
      - 'v*-ru.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ru-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'SNAK84/lagrange-reader'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Russian release sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'feat/russian-localization' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/feat/russian-localization
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ru\.[1-9][0-9]*$ ]]
          grep -q 'applicationId = "com.vangeaux.lagrange.ru"' app/build.gradle.kts
          tag="v$version"
          if [[ "$EVENT" == push ]]; then [[ "$REF_NAME" == "$tag" ]]; fi
          test -f "docs/release-notes/$tag.md"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            [[ "$(git rev-list -n 1 "$tag")" == "$(git rev-parse HEAD)" ]]
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate and configure RU signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.RU_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RU_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RU_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RU_RELEASE_KEY_PASSWORD }}
          EXPECTED_SIGNER: ${{ vars.RU_RELEASE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_SIGNER; do
            [[ -n "${!name}" ]] || { echo "Missing configuration: $name" >&2; exit 1; }
          done
          # TXT files may acquire a trailing CR/LF when copied into GitHub.
          for name in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_SIGNER; do
            value="${!name}"
            while [[ "$value" == *$'\r' || "$value" == *$'\n' ]]; do
              value="${value%?}"
            done
            printf -v "$name" '%s' "$value"
            export "$name"
          done
          expected="$(printf '%s' "$EXPECTED_SIGNER" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid RU_RELEASE_SIGNER_SHA256"; exit 1; }
          if ! printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 --decode > release-key.jks; then
            echo "::error::Invalid RU_RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          if ! keytool -list -keystore release-key.jks -storepass:env STORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::Cannot open keystore: check RU_RELEASE_KEYSTORE_BASE64 and RU_RELEASE_STORE_PASSWORD"
            exit 1
          fi
          if ! actual="$(keytool -exportcert -keystore release-key.jks -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" 2>/dev/null | sha256sum | cut -d ' ' -f1)"; then
            echo "::error::Cannot find certificate: check RU_RELEASE_KEY_ALIAS"
            exit 1
          fi
          [[ "$actual" == "$expected" ]] || { echo "::error::Keystore certificate does not match RU_RELEASE_SIGNER_SHA256"; exit 1; }
          csr="$(mktemp)"
          if ! keytool -certreq -keystore release-key.jks -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD -alias "$KEY_ALIAS" -file "$csr" >/dev/null 2>&1; then
            rm -f "$csr"
            echo "::error::Cannot open private key: check RU_RELEASE_KEY_PASSWORD"
            exit 1
          fi
          rm -f "$csr"
          # Encode Java Properties safely, including literal backslashes and spaces.
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              result = []
              for char in value:
                  if char in "\\ =:#!":
                      result.append("\\" + char)
                  elif char == "\t":
                      result.append("\\t")
                  elif char == "\r":
                      result.append("\\r")
                  elif char == "\n":
                      result.append("\\n")
                  elif 32 <= ord(char) <= 126:
                      result.append(char)
                  else:
                      units = char.encode("utf-16-be")
                      result.extend("\\u" + units[i:i+2].hex() for i in range(0, len(units), 2))
              return "".join(result)

          values = {
              "storeFile": "release-key.jks",
              "storePassword": os.environ["STORE_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "keyPassword": os.environ["KEY_PASSWORD"],
          }
          Path("keystore.properties").write_text(
              "".join(key + "=" + escape(value) + "\n" for key, value in values.items()),
              encoding="ascii",
          )
          PY
          printf '%s\n' "$expected" > app/src/main/assets/release-signer-sha256.txt
          echo "RU signing preflight passed: keystore, private key and certificate verified."
      - name: Validate localization and run tests
        run: |
          chmod +x gradlew
          python3 tools/validate_android_localizations.py
          python3 -m unittest tools/test_validate_android_localizations.py tools/test_check_hardcoded_ui_strings.py
          ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest --no-daemon --console=plain
      - name: Build and sign APKs
        run: ./gradlew assembleRelease -PreleaseAbiSplits --no-daemon --console=plain
      - name: Verify package, version and signer on every APK
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          expected="$(cat app/src/main/assets/release-signer-sha256.txt)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)"
          out=app/build/outputs/apk/release
          mkdir -p release-assets
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            apk="$out/app-$abi-release.apk"
            test -s "$apk"
            actual="$("$tools/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #[0-9]+ certificate SHA-256 digest:/ { print tolower($2) }')"
            [[ "$actual" == "$expected" ]]
            badging="$("$tools/aapt" dump badging "$apk")"
            grep -Fq "name='com.vangeaux.lagrange.ru' versionCode='$version_code' versionName='$RELEASE_VERSION'" <<< "$badging"
            if [[ "$abi" == universal ]]; then
              cp "$apk" "release-assets/Lagrange-$RELEASE_VERSION.apk"
            else
              cp "$apk" "release-assets/Lagrange-$RELEASE_VERSION-$abi.apk"
            fi
          done
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite." >&2
            exit 1
          fi
          args=(--target "$RELEASE_SHA")
          if [[ "$EVENT" == push ]]; then args+=(--verify-tag); fi
          gh release create "$RELEASE_TAG" release-assets/* "${args[@]}" \
            --notes-file "docs/release-notes/$RELEASE_TAG.md" \
            --title "Lagrange Reader RU $RELEASE_VERSION" --latest
      - name: Remove signing material
        if: always()
        run: rm -f release-key.jks keystore.properties
